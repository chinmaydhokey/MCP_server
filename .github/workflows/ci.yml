name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm lint
      - name: Typecheck (tsc --noEmit per package)
        run: pnpm typecheck
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  unit:
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Unit tests
        run: pnpm test

  smoke:
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QA_BRAIN_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `playwright` is a dependency of @qa-brain/adapter-playwright, not of the workspace root, so both the
      # version probe and the install must run in that package (pnpm keeps node_modules strict).
      # The browser revision is tied to the pinned playwright version, so the cache key follows it.
      - id: pw
        shell: bash
        working-directory: packages/adapter-playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: pnpm --filter @qa-brain/adapter-playwright exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Smoke test (real browser through the gateway)
        run: pnpm smoke
      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: .qa-brain
          if-no-files-found: ignore
          retention-days: 7

  # A `docker-build` job (PR-only, building docker/qa-brain.Dockerfile and docker/browser.Dockerfile with
  # `cache-from: type=gha`) is specified in docs/ci-cd.md section 2. It is added in the same change that adds
  # those Dockerfiles, so this workflow never references a file that does not exist yet.
