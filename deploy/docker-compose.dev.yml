# QA Brain -- development overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What this overlay changes, and nothing else:
#   1. builds the two application images from the working tree instead of pulling GHCR tags
#   2. adds Jaeger and points the collector's traces pipeline at it
#   3. publishes a few ports, every one of them bound to 127.0.0.1
#   4. turns the log level up and keeps redacted tool arguments in the action log
#
# It does NOT relax the hardening baseline. read_only, cap_drop, no-new-privileges, the
# seccomp profile and the three networks are identical to production, because a hardening
# bug that only shows up in prod is a hardening bug you find at 3 a.m.
#
# M0 STATUS: as with the base file, this is a design artefact -- hosted mode is wired up in
# milestone M5. What DOES work today is the Jaeger half: docs/observability.md section 7
# documents `docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml
# up -d jaeger` plus a local stdio gateway exporting straight to http://localhost:4318.

name: qa-brain

services:

  migrate:
    build: &qa-brain-build
      context: ..
      dockerfile: docker/qa-brain.Dockerfile
      args:
        NODE_IMAGE: node:22-bookworm-slim
        PNPM_VERSION: 10.34.5
    image: qa-brain:dev

  qa-brain:
    build: *qa-brain-build
    image: qa-brain:dev
    environment:
      QA_BRAIN_LOG_LEVEL: ${QA_BRAIN_LOG_LEVEL:-debug}
      # Locally it is worth keeping redacted argument values in action_log rows; hosted mode
      # keeps only the shape.
      QA_BRAIN_LOG_ARGS_MODE: ${QA_BRAIN_LOG_ARGS_MODE:-redacted}
      QA_BRAIN_PUBLIC_URL: ${QA_BRAIN_PUBLIC_URL:-http://127.0.0.1:8080}
    ports:
      # Loopback only. Binding 0.0.0.0 here would put an MCP endpoint on every interface of
      # the dev machine, which is exactly the DNS-rebinding/Origin surface threat model T8
      # is about.
      - "127.0.0.1:8080:8080"

  worker:
    build: *qa-brain-build
    image: qa-brain:dev
    environment:
      QA_BRAIN_LOG_LEVEL: ${QA_BRAIN_LOG_LEVEL:-debug}

  playwright-mcp:
    build:
      context: ..
      dockerfile: docker/browser.Dockerfile
      args:
        NODE_IMAGE: node:22-bookworm-slim
        PLAYWRIGHT_VERSION: 1.62.1
        PNPM_VERSION: 10.34.5
    image: qa-brain-browser:dev
    ports:
      # Handy for `curl -X POST http://127.0.0.1:8931/mcp` while debugging the sidecar.
      # Note --allowed-hosts playwright-mcp still rejects a Host header of 127.0.0.1:8931,
      # so add `--allowed-hosts 127.0.0.1` to the command temporarily if you need this.
      - "127.0.0.1:8931:8931"

  otel-collector:
    environment:
      QA_BRAIN_OTEL_TRACES_ENDPOINT: jaeger:4317
    ports:
      # Lets a gateway running on the host (stdio mode, `pnpm dev:otel`) export to the
      # containerised collector.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # Prometheus scrape endpoint.
      - "127.0.0.1:8889:8889"

  postgres:
    ports:
      # psql from the host during development. Never published in prod.
      - "127.0.0.1:5432:5432"

  seaweedfs:
    ports:
      # S3 API, for `aws --endpoint-url http://127.0.0.1:8333 s3 ls`.
      - "127.0.0.1:8333:8333"
      # Master UI.
      - "127.0.0.1:9333:9333"

  # -------------------------------------------------------------------------------------
  # jaeger -- dev-only trace backend (docs/deployment.md section 3.1, profile `dev`).
  #
  # Jaeger 2 speaks OTLP natively, so the collector simply forwards to it on 4317. For a
  # laptop the collector can be skipped entirely and the gateway can export straight here.
  # -------------------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # UI. Reports render http://localhost:16686/trace/<trace_id> next to each failed step.
      - "127.0.0.1:16686:16686"
    networks:
      - data
    # No healthcheck: the all-in-one image is distroless, same constraint as the collector.
    # Nothing depends on Jaeger being healthy -- losing traces must never stop a test run.
    healthcheck:
      disable: true
    mem_limit: 1g
    cpus: 1
