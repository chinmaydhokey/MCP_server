<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in — QA Brain Example Shop</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 30rem; line-height: 1.5; }
      label { display: block; margin: 0.75rem 0 0.25rem; }
      input { width: 100%; padding: 0.5rem; font-size: 1rem; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; font-size: 1rem; }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="signin">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" data-testid="signin-submit">Sign in</button>
    </form>
    <p id="result" role="status"></p>
    <script>
      document.getElementById('signin').addEventListener('submit', (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        document.getElementById('result').textContent = email
          ? `Signed in as ${email}`
          : 'Email is required';
      });
    </script>
  </body>
</html>
